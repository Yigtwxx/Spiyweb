[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spiyweb"
version = "0.0.1"
description = "Graph-based retrieval for RAG: the query is injected as an energy seed and spreads outward with decay."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yigit Erdogan", email = "yigiterdogan023@gmail.com" }]
keywords = ["rag", "retrieval", "graph", "spreading-activation", "personalized-pagerank"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The propagation core is pure Python on purpose: `core/` must stay free of I/O
# and heavy dependencies. Embeddings, FAISS and the NLI edge builder arrive in
# their own layers, never here.
dependencies = []

[project.optional-dependencies]
# Developer inspection tool, never a package dependency: pip install spiyweb[ui]
# `store` is not optional here: the inspector reads vectors.npz for both the
# seed search and the dedup similarity backend. `embed` stays out on purpose -
# torch is a two-gigabyte dependency, and the corpus-atom query mode works
# without it, so the tool is fully usable with `store` alone.
ui = ["streamlit>=1.36", "spiyweb[store]"]
# Heavy index-time dependencies stay granular on purpose: `dependencies = []`
# is the packaging-level face of the core-purity rule. `index` is the union.
store = ["numpy>=1.26", "faiss-cpu>=1.8"]
embed = ["sentence-transformers>=3.0"]
entity = ["spacy>=3.7"]
# Index-time NLI contradiction marking (D26): the real model wrapper only.
nli = ["torch>=2.2", "transformers>=4.40"]
# The browser face: a FastAPI process serving `web/`. Like `ui`, it lives in
# the repository rather than in the wheel - `dependencies = []` is the rule
# that keeps the propagation core free of all of this.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "spiyweb[store]"]
index = ["spiyweb[store]", "spiyweb[embed]", "spiyweb[entity]"]

[project.urls]
Homepage = "https://github.com/Yigtwxx/spiyweb"
Source = "https://github.com/Yigtwxx/spiyweb"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/spiyweb"]

[tool.ruff]
line-length = 88
target-version = "py311"
# `ui` and `server` join the first-party roots so isort keeps `graph_view`
# and `server.*` out of the third-party block; the package itself still ships
# only `src/spiyweb`.
src = ["src", "tests", "ui", "server"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates are measured artifacts: their text is the LLM-cache key,
# so a long example line must stay byte-identical to the measured run.
"src/spiyweb/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `streamlit run ui/app.py` puts `ui/` on sys.path[0], so the inspector imports
# `graph_view` by its bare name; pytest runs from the repo root and would not
# find it. One canonical module name, both contexts, no `ui/__init__.py`.
# The repo root joins it for the same reason: `server/` is a repository package,
# not a wheel package, so nothing installs it onto sys.path for the test run.
pythonpath = [".", "ui"]
addopts = "-q"
