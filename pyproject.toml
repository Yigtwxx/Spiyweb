[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spiyweb"
dynamic = ["version"]
description = "Graph-based retrieval for RAG: the query is injected as an energy seed and spreads outward with decay."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yigit Erdogan", email = "yigiterdogan023@gmail.com" }]
keywords = ["rag", "retrieval", "graph", "spreading-activation", "personalized-pagerank"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The propagation core is pure Python on purpose: `core/` must stay free of I/O
# and heavy dependencies. Embeddings, FAISS and the NLI edge builder arrive in
# their own layers, never here.
dependencies = []

[project.optional-dependencies]
# `spiyweb.scene` - layout, scene building and comparison for the activated
# web. Promoted out of the repo-rooted Streamlit tool in Faz 2.2, so it now
# ships in the wheel; numpy alone is enough to import it, which is exactly
# the constraint that kept it render-agnostic in the first place.
view = ["numpy>=1.26"]
# Heavy index-time dependencies stay granular on purpose: `dependencies = []`
# is the packaging-level face of the core-purity rule. `index` is the union.
store = ["numpy>=1.26", "faiss-cpu>=1.8"]
embed = ["sentence-transformers>=3.0"]
entity = ["spacy>=3.7"]
# Index-time NLI contradiction marking (D26): the real model wrapper only.
nli = ["torch>=2.2", "transformers>=4.40"]
# The browser face: a FastAPI process serving `web/`. Like `ui`, it lives in
# the repository rather than in the wheel - `dependencies = []` is the rule
# that keeps the propagation core free of all of this.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "spiyweb[store]",
    "spiyweb[view]",
]
index = ["spiyweb[store]", "spiyweb[embed]", "spiyweb[entity]"]

# One terminal command, four verbs, each wrapping something the Python API
# already does. `spiyweb version` must work on a bare install - that is
# exactly when someone needs to be told which extra is missing - so
# `spiyweb.cli` imports with no dependency of its own.
[project.scripts]
spiyweb = "spiyweb.cli:main"

[project.urls]
Homepage = "https://github.com/Yigtwxx/spiyweb"
Source = "https://github.com/Yigtwxx/spiyweb"

[dependency-groups]
# `httpx` is not a runtime dependency of anything: `fastapi.testclient` needs
# it, and the `web` extra deliberately does not carry a test client into a
# user's environment.
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

# The version has ONE source: `__init__.py`. A second copy in this file
# drifts sooner or later, and a drifted version number lies about which
# code produced a measurement artifact.
[tool.hatch.version]
path = "src/spiyweb/__init__.py"

# `[tool.hatch.build]` and not the wheel target alone: `uv build` (or
# `python -m build`) builds the SDIST first and then builds the wheel FROM
# that sdist. Naming the bundle only under the wheel target meant the sdist
# excluded it - it is gitignored - and the wheel built from that sdist came
# out 229 KB with no page in it, while `uv build --wheel` produced the right
# 1.4 MB artifact. Two commands, two different wheels, and the broken one is
# the one a release would have used. Found 2026-08-26, before any upload.
[tool.hatch.build]
# The compiled browser bundle is gitignored - a public history has no business
# carrying minified JavaScript - and gitignored files are excluded by default,
# so it has to be named here to reach either artifact. Named as a pattern
# rather than force-included: a checkout that never ran `npm run build` simply
# ships no bundle, and the viewer says so in a sentence, instead of the build
# failing on a missing directory.
artifacts = ["src/spiyweb/viewer/static/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/spiyweb"]

[tool.ruff]
line-length = 88
target-version = "py311"
# `server` joins the first-party roots so isort keeps `server.*` out of the
# third-party block; the package itself still ships only `src/spiyweb`.
src = ["src", "tests", "server"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates are measured artifacts: their text is the LLM-cache key,
# so a long example line must stay byte-identical to the measured run.
"src/spiyweb/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root only: `server/` is a repository package rather than a wheel
# package, so nothing installs it onto sys.path for the test run. `ui/` used
# to be here too, for a bare `import graph_view`; that module now lives in
# the package as `spiyweb.scene` and needs no path help.
pythonpath = ["."]
addopts = "-q"
