name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # The core is pure Python, but the project is meant to run on all three
    # desktop platforms, so the matrix is the point rather than a formality.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync environment
        # `store` is non-negotiable in CI: FAISS itself is the unit under
        # test, there is nothing to fake. `entity` buys the real spaCy import
        # path cheaply (no model download). `embed` (torch) stays out: every
        # line of its glue is covered by fake-encoder tests.
        run: uv sync --group dev --extra store --extra entity

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
