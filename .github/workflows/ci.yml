name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # The core is pure Python, but the project is meant to run on all three
    # desktop platforms, so the matrix is the point rather than a formality.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync environment
        # `store` is non-negotiable in CI: FAISS itself is the unit under
        # test, there is nothing to fake. `entity` buys the real spaCy import
        # path cheaply (no model download). `web` carries pydantic, which
        # `server/schemas.py` imports, so the server tests collect at all.
        # `embed` (torch) stays out: every line of its glue is covered by
        # fake-encoder tests.
        run: uv sync --group dev --extra store --extra entity --extra web

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  web:
    # The browser face is TypeScript, and until Faz 2.5 nothing here compiled
    # it: a type error or a broken build reached main freely because Python
    # CI cannot see it. It ships inside the wheel now, so a bundle that does
    # not build is a wheel that does not work.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly the lockfile
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build - `tsc -b` first, so a type error fails here
        run: npm run build
        working-directory: web

      - name: The bundle landed inside the package
        # `vite.config.ts` builds into `src/spiyweb/viewer/static`, not into
        # `web/dist`. If that ever silently reverts, the wheel job below
        # would quietly ship a viewer with no page in it.
        run: test -f src/spiyweb/viewer/static/index.html

  wheel:
    # The zero-dependency rule is a PACKAGING claim, and the `check` job
    # structurally cannot test it: `uv sync --extra store --extra entity
    # --extra web` puts numpy, faiss and pydantic on the path, so
    # `import spiyweb` succeeds there whatever the wheel contains. This job is
    # the only place the claim is measured, and the only place `py.typed`, the
    # single version source and the canonical trace are checked on the
    # ARTIFACT rather than on the checkout.
    #
    # ubuntu only, deliberately: the wheel is `py3-none-any` - byte-identical
    # on all three platforms - and what is under test is dependency isolation,
    # which has no OS dimension. The day a compiled extension ships, this job
    # joins the matrix and not a day before.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the browser bundle into the package
        # Before the wheel, deliberately: `artifacts` in pyproject.toml packs
        # `src/spiyweb/viewer/static` if it exists and shrugs if it does not,
        # so building afterwards would produce a wheel whose `inspect_url()`
        # has no page to serve - and nothing downstream would notice.
        run: npm ci && npm run build
        working-directory: web

      - name: Build BOTH artifacts, the way a release does
        # `uv build` and not `uv build --wheel`: the two-target build makes
        # the sdist first and then builds the wheel FROM it, which is the
        # path a release takes and the only one that catches a file the
        # sdist forgot. On 2026-08-26 it produced a 229 KB wheel with no
        # browser bundle while `--wheel` produced the right 1.4 MB one.
        run: uv build

      - name: Both artifacts carry the browser bundle
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile

          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          packed = [n for n in names if n.startswith("spiyweb/viewer/static/")]
          assert "spiyweb/viewer/static/index.html" in names, "no bundle in the wheel"

          sdist = tarfile.open(sorted(glob.glob("dist/*.tar.gz"))[-1]).getnames()
          in_sdist = [n for n in sdist if "viewer/static" in n]
          assert in_sdist, "no bundle in the sdist - a release wheel built from it would have none"

          print(f"bundle ok: {len(packed)} in the wheel, {len(in_sdist)} in the sdist")
          PY

      - name: The artifacts are fit to upload
        run: uvx twine check dist/*

      - name: Install it into an empty environment - no extras, no dev group
        run: |
          uv venv .wheelenv
          uv pip install --python .wheelenv/bin/python dist/*.whl

      - name: The environment really is empty
        # Logged as well as asserted: if a dependency ever leaks in, the list
        # is right there next to the failure. An explicit `exit 1` rather
        # than `! cmd`, which errexit does not apply to and which would stop
        # guarding the moment a line is added after it.
        run: |
          uv pip list --python .wheelenv/bin/python
          for mod in numpy faiss torch spacy transformers fastapi pydantic; do
            if .wheelenv/bin/python -c "import $mod" 2>/dev/null; then
              echo "::error::$mod installed - the wheel is not dependency-free"
              exit 1
            fi
          done

      - name: Smoke the artifact
        run: .wheelenv/bin/python tests/wheel_smoke.py

      - name: The terminal command was registered, and runs with no extras
        # `spiyweb version` exists to tell someone which extra is missing, so
        # an extras-free environment is the one place it MUST work. Every row
        # reading "not installed" here is the correct answer.
        run: |
          .wheelenv/bin/spiyweb version
          .wheelenv/bin/spiyweb --version
